server {
    listen 0.0.0.0:80;
    server_name crazythursdayplay.bbroot.com;

    return 308 https://$host$request_uri;
}

server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name crazythursdayplay.bbroot.com;

    ssl_certificate /var/spool/nginx/zhajinhua-tls/fullchain.pem;
    ssl_certificate_key /var/spool/nginx/zhajinhua-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ZHAJINHUA_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_conn public_total 128;
    limit_conn public_per_ip 32;
    limit_conn_status 503;
    limit_req zone=public_rate burst=200 nodelay;
    limit_req_status 429;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3100;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_next_upstream off;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "443";
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Forwarded "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Proxy-Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
