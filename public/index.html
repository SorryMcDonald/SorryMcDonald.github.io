<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>炸金花 · 虚拟娱乐牌桌</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><span class="brand-mark">♠</span><span class="brand-name">炸金花</span><span class="brand-sub">虚拟娱乐牌桌</span></div>
      <nav class="top-actions"><button id="leaderboardButton" class="ghost-button">排行榜</button><button id="settingsButton" class="ghost-button">设置</button><span id="accountLabel" class="account-label">未登录</span></nav>
    </header>
    <div id="globalTicker" class="ticker" aria-live="polite"></div>
    <main>
      <section id="authView" class="auth-view">
        <div class="auth-copy"><p class="eyebrow">SERVER TABLE / 01</p><h1>炸 金 花 · 联机</h1><p>三张牌 · 房号约局</p></div>
        <form id="authForm" class="auth-panel">
          <div class="auth-panel-head">
            <h2 id="authTitle">欢迎回来</h2>
            <p id="authSubtitle">登录您的账号以继续</p>
          </div>
          <label>邮箱<input id="emailInput" type="email" autocomplete="email" placeholder="请输入邮箱" required></label>
          <label id="nicknameField" hidden>昵称<input id="nicknameInput" autocomplete="nickname" placeholder="请输入玩家昵称"></label>
          <label>密码<input id="passwordInput" type="password" autocomplete="current-password" minlength="8" placeholder="请输入密码" required></label>
          <button class="primary-button auth-submit" type="submit" id="authSubmit">登录</button>
          <p id="authError" class="error-text" role="alert"></p>
          <div class="auth-switch"><span id="authModePrompt">还没有账号？</span><button class="text-button" type="button" id="authModeToggle">注册</button></div>
        </form>
      </section>
      <section id="tableView" hidden>
        <div class="table-toolbar">
          <div class="room-heading"><span class="eyebrow">ROOM</span><strong id="roomCode">房间大厅</strong><span id="roundStatus" class="status-pill">选择房间</span></div>
          <div class="toolbar-actions">
            <button id="createRoomButton" class="primary-button">创建房间</button>
            <button id="joinRoomButton" class="ghost-button">房号加入</button>
            <button id="leaveRoomButton" class="danger-button" hidden>退出房间</button>
            <button id="startNextButton" class="primary-button" hidden>开始下一局</button>
            <button id="observeButton" class="ghost-button" hidden>开启观战</button>
            <button id="spectateButton" class="ghost-button" hidden>进入观战</button>
          </div>
        </div>
        <section id="roomLobby" class="room-lobby">
          <div class="room-lobby-head"><div><h2>可加入房间</h2><p id="roomListStatus">正在加载房间...</p></div><button id="refreshRoomsButton" class="ghost-button">刷新房间</button></div>
          <div id="roomList" class="room-list" aria-live="polite"></div>
        </section>
        <div class="table-layout" id="tableLayout" hidden><div class="felt" id="felt"><div class="felt-center"><div class="pot-label">底池</div><div id="potValue" class="pot-value">0</div><div id="compareNotice" class="compare-notice" aria-live="polite"></div></div><div id="players" class="players"></div></div><aside class="side-panel"><section><div class="panel-heading"><h2>本局信息</h2><span id="roleLabel" class="role-label"></span></div><div id="roundFeed" class="round-feed"></div></section><section class="action-panel" id="actionPanel"><div class="panel-heading"><h2>你的操作</h2><span id="beansLabel">0 豆</span></div><div class="action-grid"><button data-action="fold" class="danger-button">弃牌</button><button data-action="call" class="ghost-button">跟注</button><button data-action="raise" class="primary-button">加注</button><button data-action="all_in" class="gold-button">梭哈</button><button data-action="compare" class="compare-button">比牌</button></div><p class="hint">比牌阶段先展示发起与胜负，结算时公开牌面。</p></section></aside></div>
      </section>
      <section id="leaderboardView" hidden><div class="page-heading"><button id="backToTable" class="ghost-button">返回牌桌</button><div><p class="eyebrow">GLOBAL RANKING</p><h1>赌神榜 / 散财榜</h1></div></div><div class="leaderboard-tabs"><button class="tab-button active" data-kind="wins">赌神榜</button><button class="tab-button" data-kind="losses">散财榜</button></div><div id="leaderboardList" class="leaderboard-list"></div></section>
    </main>
    <footer>本游戏仅虚拟娱乐，禁止任何形式现金赌博，禁止线下结算，违者责任自负</footer>
  </div>
  <dialog id="settingsDialog"><form method="dialog" class="settings-panel"><div class="panel-heading"><h2>牌桌设置</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button></div><label class="setting-row"><span>背景音乐</span><input id="musicToggle" type="checkbox"></label><label class="setting-row"><span>音效</span><input id="effectsToggle" type="checkbox"></label><label class="setting-row"><span>动画模式</span><select id="motionSelect"><option value="light">轻量</option><option value="cinematic">影视</option></select></label></form></dialog>
  <audio id="backgroundMusic" loop preload="none"></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
