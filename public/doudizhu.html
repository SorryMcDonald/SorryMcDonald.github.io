<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092b43">
  <title>欢乐斗地主 · 牌局</title>
  <link rel="stylesheet" href="/doudizhu.css">
</head>
<body data-game="doudizhu">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回牌局大厅"><span class="brand-mark">♠</span><span><strong>欢乐斗地主</strong><small>经典叫抢 · 好友约局</small></span></a>
    <nav aria-label="游戏导航"><a href="/">炸金花</a><a href="/dezhou.html">德州扑克</a><a class="active" href="/doudizhu.html" aria-current="page">斗地主</a></nav>
    <div class="account-tools"><span id="accountLabel">未登录</span><button id="soundButton" class="icon-button" type="button" aria-label="关闭音效" title="关闭音效">🔊</button></div>
  </header>
  <div id="globalTicker" class="ticker" aria-live="polite"></div>

  <main>
    <section id="authView" class="auth-view">
      <div class="auth-brand"><span>♛</span><p>经典玩法</p><h1>欢乐斗地主</h1><small>叫地主 · 抢地主 · 加倍 · 春天</small></div>
      <form id="authForm" class="auth-panel">
        <h2 id="authTitle">欢迎回来</h2><p>登录共享牌局账号，马上开桌</p>
        <label>邮箱<input id="emailInput" type="email" autocomplete="email" placeholder="请输入邮箱" required></label>
        <label id="nicknameField" hidden>昵称<input id="nicknameInput" maxlength="24" autocomplete="nickname" placeholder="请输入昵称"></label>
        <label>密码<input id="passwordInput" type="password" minlength="8" autocomplete="current-password" placeholder="至少 8 位" required></label>
        <button id="authSubmit" class="gold-button" type="submit">登录</button>
        <button id="authModeToggle" type="button" class="link-button">注册新账号</button>
        <p id="authError" class="error" role="alert"></p>
      </form>
    </section>

    <section id="lobbyView" class="lobby-view" hidden>
      <div class="lobby-heading"><div><span class="eyebrow">CLASSIC MODE</span><h1>经典斗地主</h1><p>选择底分，邀请好友加入房间</p></div><button id="logoutButton" class="ghost-button" type="button">退出登录</button></div>
      <div class="create-bar"><label><span>游戏人数</span><select id="maxPlayers"><option>2</option><option selected>3</option><option>4</option></select></label><label><span>房间底分</span><select id="baseScore"><option>10</option><option>50</option><option selected>100</option><option>200</option><option>500</option><option>1000</option></select></label><button id="createButton" class="gold-button" type="button">创建房间</button></div>
      <div class="room-list-head"><h2>可加入牌桌</h2><button id="refreshRoomsButton" class="text-button" type="button">刷新</button></div>
      <div id="rooms" class="rooms" aria-live="polite"></div>
      <p id="lobbyError" class="error" role="alert"></p>
    </section>

    <section id="roomView" class="room-view" hidden>
      <div class="room-toolbar">
        <div class="room-identity"><span id="phaseDot" class="phase-dot"></span><span><small id="phaseLabel">等待开局</small><strong>房间 <b id="roomCode"></b></strong></span><button id="copyRoomButton" class="copy-button" type="button">复制房号</button></div>
        <div class="table-metrics"><span>底分 <b id="baseScoreLabel">0</b></span><span>倍数 <b id="multiplierLabel">×1</b></span><span>牌局 <b id="roundLabel">等待</b></span></div>
        <div class="room-actions"><button id="soundRoomButton" class="icon-button" type="button" aria-label="关闭音效" title="关闭音效">🔊</button><button id="leaveButton" class="danger-button" type="button">退出房间</button></div>
      </div>

      <div id="table" class="game-table">
        <div class="felt-texture"></div>
        <div id="effectLayer" class="effect-layer" aria-hidden="true"><strong></strong></div>
        <div id="players" class="players"></div>
        <div id="bottomCards" class="bottom-cards" hidden><span>地主底牌</span><div></div></div>
        <div id="gamePanel" class="game-panel" aria-live="polite"></div>
        <div id="hand" class="hand" aria-label="我的手牌"></div>
        <div id="selectionHint" class="selection-hint"></div>
        <p id="roomError" class="error room-error" role="alert"></p>
      </div>
    </section>
  </main>
  <footer>健康游戏忠告：抵制不良游戏，拒绝赌博，适度游戏益脑，沉迷游戏伤身。</footer>
  <script type="module" src="/doudizhu.js"></script>
</body>
</html>
